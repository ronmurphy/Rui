name: Release Rui
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Crucial for creating the release

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows
        # Added 'ghcr.io' prefix for more reliable pulling
        uses: docker://ghcr.io/mglolenstine/gtk4-cross:latest
        with:
          args: /bin/bash -c "cargo build --target x86_64-pc-windows-gnu --release && ./package-win.sh"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libfuse2 wget
      - name: Build AppImage
        run: |
          cargo install cargo-appimage
          # Ensure appimagetool is available
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          cargo appimage