[package]
name = "rui"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A GTK4 UI designer for Rust developers — edit .ui files with live preview"
repository = "https://github.com/ronmurphy/Rui"

[[bin]]
name = "rui"
path = "src/main.rs"

[features]
default = ["preview"]
preview = ["dep:webkit6"]

[dependencies]
gtk4          = { version = "0.9", features = ["v4_10"] }
sourceview5   = "0.9"
dirs          = "6"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
async-channel = "2"
roxmltree     = "0.20"
ureq          = { version = "2", features = ["native-tls"] }
log           = "0.4"
env_logger    = "0.11"
tokio         = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "sync", "macros"] }
lsp-types     = "0.94"
url           = "2"

# WebKit preview — optional, requires webkitgtk-6.0 system library
webkit6 = { version = "0.4", optional = true }

[package.metadata.bundle]
name = "Rui"
identifier = "com.ronmurphy.rui"
icon = ["data/Rui.png"]
bin = "rui"
category = "Development"
short_description = "GTK4 Rust UI Assistant"
