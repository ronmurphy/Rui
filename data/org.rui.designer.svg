<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#shine)"/>

  <!-- Grid lines suggesting a form designer -->
  <line x1="28" y1="32" x2="28" y2="96" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="52" y1="32" x2="52" y2="96" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="76" y1="32" x2="76" y2="96" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="100" y1="32" x2="100" y2="96" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="28" y1="48" x2="100" y2="48" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="28" y1="64" x2="100" y2="64" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="28" y1="80" x2="100" y2="80" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Stylised "R" letterform -->
  <text x="64" y="82" font-family="sans-serif" font-weight="800" font-size="64"
        fill="#ffffff" text-anchor="middle" dominant-baseline="central"
        letter-spacing="-2">R</text>

  <!-- Small widget rectangles in the corner suggesting UI blocks -->
  <rect x="82" y="86" width="16" height="8" rx="2" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="82" y="76" width="16" height="8" rx="2" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Selection handle dots (VB-style!) -->
  <circle cx="30" cy="34" r="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="30" cy="96" r="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="100" cy="34" r="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="100" cy="96" r="2.5" fill="#ffffff" fill-opacity="0.7"/>
</svg>
